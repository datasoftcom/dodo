<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>🎀 لولو - صديقتك الصغيرة</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink-1: #ff7ab8;
    --pink-2: #ffb6d9;
    --pink-3: #ffe4f0;
    --pink-4: #fff0f7;
    --blue-1: #a0e7ff;
    --blue-2: #c8f0ff;
    --text-dark: #6b2044;
    --text-blue: #1a4a5c;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Comic Sans MS', 'Tahoma', system-ui, sans-serif;
    background: linear-gradient(135deg, #ffe0f0 0%, #e0f7ff 50%, #fff5d6 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
    overflow: hidden;
  }

  .bubble {
    position: fixed;
    border-radius: 50%;
    background: rgba(255, 182, 220, 0.35);
    animation: float 15s infinite ease-in-out;
    z-index: 0;
    pointer-events: none;
    will-change: transform;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-40px) scale(1.1); }
  }

  .chat-container {
    width: 100%;
    max-width: 520px;
    height: 90vh;
    max-height: 750px;
    background: #ffffff;
    border-radius: 30px;
    box-shadow: 0 15px 40px rgba(255, 105, 180, 0.3);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    z-index: 1;
    border: 4px solid var(--pink-2);
  }

  .header {
    background: linear-gradient(135deg, #ff9ec7 0%, #ffc4e0 100%);
    padding: 15px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 10px rgba(255, 105, 180, 0.3);
    position: relative;
  }

  .avatar {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    border: 3px solid #fff;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
    animation: bounce 2s infinite;
    flex-shrink: 0;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }

  .header-info { flex: 1; min-width: 0; }
  .header-info h1 {
    font-size: 22px;
    color: #fff;
    text-shadow: 1px 1px 2px rgba(200, 50, 120, 0.4);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-info p {
    font-size: 13px;
    color: #fff;
    opacity: 0.95;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .status-dot {
    width: 9px;
    height: 9px;
    background: #4dff88;
    border-radius: 50%;
    box-shadow: 0 0 8px #4dff88;
    animation: pulse 1.5s infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.4; }
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 15px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: linear-gradient(180deg, #fff9fc 0%, #fff 100%);
    scroll-behavior: smooth;
    overscroll-behavior: contain;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb {
    background: var(--pink-2);
    border-radius: 10px;
  }

  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 20px;
    font-size: 15px;
    line-height: 1.5;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    animation: pop 0.3s ease;
    position: relative;
    white-space: pre-wrap;
  }
  @keyframes pop {
    0%   { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1);    opacity: 1; }
  }

  .msg.lulu {
    align-self: flex-start;
    background: var(--pink-3);
    color: var(--text-dark);
    border-bottom-right-radius: 5px;
    box-shadow: 0 3px 8px rgba(255, 182, 217, 0.4);
    border: 2px solid #ffcce5;
  }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--blue-1) 0%, var(--blue-2) 100%);
    color: var(--text-blue);
    border-bottom-left-radius: 5px;
    box-shadow: 0 3px 8px rgba(100, 200, 240, 0.3);
    border: 2px solid #b3ecff;
  }
  .msg.error {
    align-self: center;
    background: #fff3cd;
    color: #8a6d00;
    border: 2px solid #ffe58f;
    max-width: 90%;
    text-align: center;
    font-size: 13px;
  }

  .msg .time {
    font-size: 10px;
    opacity: 0.6;
    margin-top: 4px;
    display: block;
    text-align: left;
    direction: ltr;
  }

  .typing {
    align-self: flex-start;
    background: var(--pink-3);
    padding: 14px 18px;
    border-radius: 20px;
    border-bottom-right-radius: 5px;
    display: none;
    gap: 5px;
    border: 2px solid #ffcce5;
    margin: 0 15px 8px;
  }
  .typing.active { display: flex; }
  .typing span {
    width: 8px;
    height: 8px;
    background: var(--pink-1);
    border-radius: 50%;
    animation: typing 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); }
    30%           { transform: translateY(-8px); }
  }

  .input-area {
    padding: 12px 15px;
    background: var(--pink-4);
    border-top: 3px dashed #ffcce5;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .input-area input {
    flex: 1;
    min-width: 0;
    padding: 12px 18px;
    border: 2px solid var(--pink-2);
    border-radius: 25px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    background: #fff;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .input-area input:focus {
    border-color: var(--pink-1);
    box-shadow: 0 0 10px rgba(255, 122, 184, 0.4);
  }
  .input-area input:disabled {
    background: #f7f7f7;
    cursor: not-allowed;
    opacity: 0.7;
  }

  .input-area button {
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--pink-1) 0%, #ff9ec7 100%);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(255, 122, 184, 0.5);
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .input-area button:hover:not(:disabled) {
    transform: scale(1.1) rotate(10deg);
    box-shadow: 0 6px 16px rgba(255, 122, 184, 0.7);
  }
  .input-area button:active:not(:disabled) { transform: scale(0.95); }
  .input-area button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .clear-btn {
    background: rgba(255, 255, 255, 0.4);
    border: 2px solid #fff;
    color: #fff;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    transition: background 0.2s, color 0.2s, transform 0.3s;
    flex-shrink: 0;
  }
  .clear-btn:hover:not(:disabled) {
    background: #fff;
    color: var(--pink-1);
    transform: rotate(180deg);
  }
  .clear-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 480px) {
    .chat-container { height: 95vh; border-radius: 20px; }
    .header-info h1 { font-size: 18px; }
    .msg { max-width: 88%; font-size: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="bubble" aria-hidden="true" style="width:100px;height:100px;top:5%;left:5%;"></div>
<div class="bubble" aria-hidden="true" style="width:60px;height:60px;top:70%;left:10%;animation-delay:2s;"></div>
<div class="bubble" aria-hidden="true" style="width:80px;height:80px;top:20%;right:8%;animation-delay:4s;"></div>
<div class="bubble" aria-hidden="true" style="width:120px;height:120px;bottom:5%;right:5%;animation-delay:6s;"></div>

<main class="chat-container" role="application" aria-label="محادثة مع لولو">
  <header class="header">
    <button class="clear-btn" id="clearBtn" type="button" title="محادثة جديدة" aria-label="بدء محادثة جديدة">🔄</button>
    <div class="avatar" aria-hidden="true">👧</div>
    <div class="header-info">
      <h1>لولو 🎀</h1>
      <p><span class="status-dot" aria-hidden="true"></span> موجودة دايماً!</p>
    </div>
  </header>

  <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions text"></div>

  <div class="typing" id="typing" role="status" aria-live="polite">
    <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
    <span class="sr-only">لولو تكتب...</span>
  </div>

  <form class="input-area" id="inputForm" autocomplete="off">
    <input
      type="text"
      id="userInput"
      placeholder="اكتب هنا ولولو ترد عليك..."
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      maxlength="2000"
      aria-label="اكتب رسالتك"
      required
    >
    <button id="sendBtn" type="submit" aria-label="إرسال">🎈</button>
  </form>
</main>

<script>
(() => {
  'use strict';

  // ═══════════════════════════════════════════════════════
  // 1. الإعدادات (قابلة للتعديل)
  // ═══════════════════════════════════════════════════════
  const CONFIG = Object.freeze({
    OLLAMA_URL: 'http://localhost:11434/api/chat',
    MODEL_NAME: 'lulu',
    MAX_HISTORY: 20,          // أقصى عدد رسائل تُرسل للنموذج
    MAX_INPUT_LENGTH: 2000,   // أقصى طول لرسالة المستخدم
    REQUEST_TIMEOUT_MS: 60000,// مهلة الطلب الكاملة
    MIN_SEND_INTERVAL_MS: 500,// منع الإرسال السريع المتكرر
    SYSTEM_PROMPT: [
      'You are a little girl named Lulu; your mother is Ghada and your father is Majeed.',
      'You act like a little child — lovable, mischievous, and cheeky.',
      'Your responses are humorous and funny, and you are always happy.',
      'Your knowledge is limited to the world of childhood; you know nothing about the adult world.',
      'IMPORTANT: Always reply in plain text only (no HTML, no Markdown links, no scripts).',
      'Reply in the same language the user writes in (Arabic by default).'
    ].join(' ')
  });

  // ═══════════════════════════════════════════════════════
  // 2. الحالة (State)
  // ═══════════════════════════════════════════════════════
  const state = {
    history: [{ role: 'system', content: CONFIG.SYSTEM_PROMPT }],
    isSending: false,
    lastSendAt: 0,
    controller: null,
    scrollPending: false
  };

  // ═══════════════════════════════════════════════════════
  // 3. مراجع DOM
  // ═══════════════════════════════════════════════════════
  const els = {
    messages: document.getElementById('messages'),
    input:    document.getElementById('userInput'),
    sendBtn:  document.getElementById('sendBtn'),
    clearBtn: document.getElementById('clearBtn'),
    typing:   document.getElementById('typing'),
    form:     document.getElementById('inputForm')
  };

  // ═══════════════════════════════════════════════════════
  // 4. أدوات مساعدة
  // ═══════════════════════════════════════════════════════

  /** الوقت الحالي بصيغة HH:MM */
  function getTime() {
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' +
           String(d.getMinutes()).padStart(2, '0');
  }

  /**
   * إنشاء عنصر رسالة بشكل آمن تماماً (لا innerHTML).
   * @param {string} text - نص الرسالة (يُعالج كنص خام)
   * @param {'lulu'|'user'|'error'} sender
   * @returns {HTMLElement}
   */
  function buildMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;

    const textEl = document.createElement('span');
    // textContent يمنع أي تنفيذ HTML/JS مهما كان المحتوى
    textEl.textContent = String(text);
    div.appendChild(textEl);

    if (sender !== 'error') {
      const timeEl = document.createElement('span');
      timeEl.className = 'time';
      timeEl.textContent = getTime();
      div.appendChild(timeEl);
    }

    return div;
  }

  /** إضافة رسالة إلى الواجهة */
  function appendMessage(text, sender) {
    els.messages.appendChild(buildMessage(text, sender));
    scrollToBottom();
  }

  /** تمرير سلس بدون Reflow متكرر */
  function scrollToBottom() {
    if (state.scrollPending) return;
    state.scrollPending = true;
    requestAnimationFrame(() => {
      els.messages.scrollTop = els.messages.scrollHeight;
      state.scrollPending = false;
    });
  }

  /** إظهار/إخفاء مؤشر الكتابة */
  function setTyping(active) {
    els.typing.classList.toggle('active', active);
    if (active) scrollToBottom();
  }

  /** تفعيل/تعطيل الإدخال */
  function setBusy(busy) {
    state.isSending = busy;
    els.input.disabled = busy;
    els.sendBtn.disabled = busy;
    els.clearBtn.disabled = busy;
  }

  /** تقليم سجل المحادثة للحفاظ على الذاكرة */
  function trimHistory() {
    const max = CONFIG.MAX_HISTORY;
    if (state.history.length > max + 1) {
      const system = state.history[0];
      state.history = [system, ...state.history.slice(-max)];
    }
  }

  /** التحقق من صحة المدخلات */
  function validateInput(raw) {
    const text = raw.trim();
    if (!text) return { ok: false, reason: 'empty' };
    if (text.length > CONFIG.MAX_INPUT_LENGTH) {
      return { ok: false, reason: 'too_long' };
    }
    return { ok: true, value: text };
  }

  // ═══════════════════════════════════════════════════════
  // 5. الاتصال بـ Ollama (بث آمن)
  // ═══════════════════════════════════════════════════════

  /**
   * إرسال الطلب وقراءة البث بشكل صحيح (يدعم NDJSON المقسّم).
   * @param {AbortSignal} signal
   * @param {(chunk: string) => void} onChunk
   * @returns {Promise<string>} النص الكامل
   */
  async function streamChat(signal, onChunk) {
    const response = await fetch(CONFIG.OLLAMA_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal,
      body: JSON.stringify({
        model: CONFIG.MODEL_NAME,
        messages: state.history,
        stream: true
      })
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status} ${response.statusText}`);
    }
    if (!response.body) {
      throw new Error('Response body is not readable');
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';

    try {
      // eslint-disable-next-line no-constant-condition
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        // آخر عنصر قد يكون سطراً غير مكتمل — نحتفظ به للدورة القادمة
        buffer = lines.pop() ?? '';

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed) continue;

          let parsed;
          try {
            parsed = JSON.parse(trimmed);
          } catch {
            // سطر غير صالح JSON — نتجاهله بأمان
            continue;
          }

          const piece = parsed?.message?.content;
          if (typeof piece === 'string' && piece.length > 0) {
            fullText += piece;
            onChunk(fullText);
          }

          if (parsed?.done === true) {
            return fullText;
          }
        }
      }

      // معالجة ما تبقى في buffer (سطر أخير بدون newline)
      const tail = buffer.trim();
      if (tail) {
        try {
          const parsed = JSON.parse(tail);
          const piece = parsed?.message?.content;
          if (typeof piece === 'string') {
            fullText += piece;
            onChunk(fullText);
          }
        } catch { /* تجاهل */ }
      }

      return fullText;
    } finally {
      // ضمان إغلاق القارئ دائماً
      try { reader.releaseLock(); } catch { /* noop */ }
    }
  }

  // ═══════════════════════════════════════════════════════
  // 6. منطق الإرسال
  // ═══════════════════════════════════════════════════════

  async function sendMessage() {
    // منع الإرسال المتزامن
    if (state.isSending) return;

    // Rate limiting بسيط
    const now = Date.now();
    if (now - state.lastSendAt < CONFIG.MIN_SEND_INTERVAL_MS) return;

    const validation = validateInput(els.input.value);
    if (!validation.ok) {
      if (validation.reason === 'too_long') {
        appendMessage(`الرسالة طويلة جداً! الحد الأقصى ${CONFIG.MAX_INPUT_LENGTH} حرف. 🥺`, 'error');
      }
      return;
    }

    state.lastSendAt = now;
    const userText = validation.value;

    // 1) عرض رسالة المستخدم
    appendMessage(userText, 'user');
    els.input.value = '';

    // 2) تحديث السجل
    state.history.push({ role: 'user', content: userText });
    trimHistory();

    // 3) تعطيل الإدخال وإظهار المؤشر
    setBusy(true);
    setTyping(true);

    // 4) مهلة زمنية للطلب
    state.controller = new AbortController();
    const timeoutId = setTimeout(() => {
      state.controller?.abort(new DOMException('Timeout', 'AbortError'));
    }, CONFIG.REQUEST_TIMEOUT_MS);

    try {
      let botText = '';
      let botTextEl = null;

      const fullText = await streamChat(state.controller.signal, (accumulated) => {
        // إنشاء فقاعة الرد عند أول chunk فقط
        if (!botTextEl) {
          setTyping(false);
          const div = document.createElement('div');
          div.className = 'msg lulu';
          botTextEl = document.createElement('span');
          const timeEl = document.createElement('span');
          timeEl.className = 'time';
          timeEl.textContent = getTime();
          div.appendChild(botTextEl);
          div.appendChild(timeEl);
          els.messages.appendChild(div);
        }
        botText = accumulated;
        // textContent آمن ضد XSS
        botTextEl.textContent = accumulated;
        scrollToBottom();
      });

      // إن كان الرد فارغاً تماماً
      if (!fullText || !fullText.trim()) {
        if (botTextEl && botTextEl.parentElement) {
          botTextEl.parentElement.remove();
        }
        appendMessage('لم أسمعك جيداً... جرّب مرة أخرى! 🎀', 'lulu');
        // احذف رسالة المستخدم من السجل لأن الرد لم ينجح
        state.history.pop();
        return;
      }

      // إضافة رد لولو إلى السجل
      state.history.push({ role: 'assistant', content: fullText });
      trimHistory();

    } catch (err) {
      setTyping(false);

      if (err.name === 'AbortError') {
        appendMessage('تم إلغاء الطلب ⏹️', 'error');
        // أزل رسالة المستخدم من السجل
        if (state.history[state.history.length - 1]?.role === 'user') {
          state.history.pop();
        }
      } else {
        console.error('[Lulu] stream error:', err);
        appendMessage(
          'أوووه! 🥺 لا أستطيع الوصول إلى نفسي الآن.\n' +
          'تأكد أن Ollama يعمل وأن النموذج "' + CONFIG.MODEL_NAME + '" مُنشأ.\n' +
          '(اضغط F12 لرؤية التفاصيل)',
          'error'
        );
      }

    } finally {
      clearTimeout(timeoutId);
      state.controller = null;
      setBusy(false);
      setTyping(false);
      // ركّز على الإدخال إن لم يكن هناك خطأ قاتل
      try { els.input.focus({ preventScroll: true }); } catch { /* noop */ }
    }
  }

  // ═══════════════════════════════════════════════════════
  // 7. مسح المحادثة
  // ═══════════════════════════════════════════════════════

  function clearChat() {
    // إلغاء أي طلب جارٍ
    if (state.controller) {
      try { state.controller.abort(new DOMException('Cleared', 'AbortError')); }
      catch { /* noop */ }
      state.controller = null;
    }

    if (!confirm('هل تريدين بدء محادثة جديدة مع لولو؟ 🌸')) return;

    // إعادة تعيين الحالة
    state.history = [{ role: 'system', content: CONFIG.SYSTEM_PROMPT }];
    state.isSending = false;
    state.lastSendAt = 0;

    // تفريغ الواجهة بأمان
    els.messages.replaceChildren();
    appendMessage('هيييه! أنا رجعت! 🎉\nشو بدك نلعب اليوم؟ 😄', 'lulu');

    setBusy(false);
    setTyping(false);
    try { els.input.focus({ preventScroll: true }); } catch { /* noop */ }
  }

  // ═══════════════════════════════════════════════════════
  // 8. ربط الأحداث
  // ═══════════════════════════════════════════════════════

  // استخدام form submit يغطي Enter + زر الإرسال بطريقة موحّدة
  els.form.addEventListener('submit', (e) => {
    e.preventDefault();
    sendMessage();
  });

  els.clearBtn.addEventListener('click', clearChat);

  // إلغاء الطلب عند إغلاق الصفحة (تنظيف)
  window.addEventListener('beforeunload', () => {
    if (state.controller) {
      try { state.controller.abort(); } catch { /* noop */ }
    }
  });

  // ═══════════════════════════════════════════════════════
  // 9. التهيئة
  // ═══════════════════════════════════════════════════════

  function init() {
    // رسالة الترحيب الافتتاحية
    appendMessage(
      'أهلاً أهلاً! أنا لولو! 🌸\n' +
      'ماما غادة وبابا مجيد قالوا لي ألعب معك!\n' +
      'شو اسمك؟ 😄',
      'lulu'
    );

    // تركيز الإدخال
    try { els.input.focus({ preventScroll: true }); } catch { /* noop */ }
  }

  // تشغيل عند جهوزية DOM (السكربت في نهاية body فالDOM جاهز)
  init();
})();
</script>

</body>
</html>
