<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎀 لولو - صديقتك الصغيرة</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Comic Sans MS', 'Tahoma', sans-serif;
    background: linear-gradient(135deg, #ffe0f0 0%, #e0f7ff 50%, #fff5d6 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
    overflow: hidden;
  }

  /* فقاعات خلفية متحركة */
  .bubble {
    position: fixed;
    border-radius: 50%;
    background: rgba(255, 182, 220, 0.35);
    animation: float 15s infinite ease-in-out;
    z-index: 0;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-40px) scale(1.1); }
  }

  .chat-container {
    width: 100%;
    max-width: 520px;
    height: 90vh;
    max-height: 750px;
    background: #ffffff;
    border-radius: 30px;
    box-shadow: 0 15px 40px rgba(255, 105, 180, 0.3);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    z-index: 1;
    border: 4px solid #ffb6d9;
  }

  /* الهيدر */
  .header {
    background: linear-gradient(135deg, #ff9ec7 0%, #ffc4e0 100%);
    padding: 15px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 10px rgba(255, 105, 180, 0.3);
  }

  .avatar {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    border: 3px solid #fff;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
    animation: bounce 2s infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  .header-info h1 {
    font-size: 22px;
    color: #fff;
    text-shadow: 1px 1px 2px rgba(200, 50, 120, 0.4);
  }
  .header-info p {
    font-size: 13px;
    color: #fff;
    opacity: 0.95;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .status-dot {
    width: 9px;
    height: 9px;
    background: #4dff88;
    border-radius: 50%;
    box-shadow: 0 0 8px #4dff88;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* منطقة الرسائل */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 15px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: linear-gradient(180deg, #fff9fc 0%, #fff 100%);
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb {
    background: #ffb6d9;
    border-radius: 10px;
  }

  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 20px;
    font-size: 15px;
    line-height: 1.5;
    word-wrap: break-word;
    animation: pop 0.3s ease;
    position: relative;
  }
  @keyframes pop {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .msg.lulu {
    align-self: flex-start;
    background: #ffe4f0;
    color: #6b2044;
    border-bottom-right-radius: 5px;
    box-shadow: 0 3px 8px rgba(255, 182, 217, 0.4);
    border: 2px solid #ffcce5;
  }

  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #a0e7ff 0%, #c8f0ff 100%);
    color: #1a4a5c;
    border-bottom-left-radius: 5px;
    box-shadow: 0 3px 8px rgba(100, 200, 240, 0.3);
    border: 2px solid #b3ecff;
  }

  .msg .time {
    font-size: 10px;
    opacity: 0.6;
    margin-top: 4px;
    display: block;
  }

  /* مؤشر الكتابة */
  .typing {
    align-self: flex-start;
    background: #ffe4f0;
    padding: 14px 18px;
    border-radius: 20px;
    border-bottom-right-radius: 5px;
    display: none;
    gap: 5px;
    border: 2px solid #ffcce5;
  }
  .typing.active { display: flex; }
  .typing span {
    width: 8px;
    height: 8px;
    background: #ff7ab8;
    border-radius: 50%;
    animation: typing 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-8px); }
  }

  /* منطقة الإدخال */
  .input-area {
    padding: 12px 15px;
    background: #fff0f7;
    border-top: 3px dashed #ffcce5;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .input-area input {
    flex: 1;
    padding: 12px 18px;
    border: 2px solid #ffb6d9;
    border-radius: 25px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    background: #fff;
    transition: all 0.3s;
  }
  .input-area input:focus {
    border-color: #ff7ab8;
    box-shadow: 0 0 10px rgba(255, 122, 184, 0.4);
  }

  .input-area button {
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff7ab8 0%, #ff9ec7 100%);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(255, 122, 184, 0.5);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .input-area button:hover {
    transform: scale(1.1) rotate(10deg);
    box-shadow: 0 6px 16px rgba(255, 122, 184, 0.7);
  }
  .input-area button:active { transform: scale(0.95); }
  .input-area button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* زر مسح المحادثة */
  .clear-btn {
    position: absolute;
    top: 18px;
    left: 15px;
    background: rgba(255,255,255,0.4);
    border: 2px solid #fff;
    color: #fff;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s;
    z-index: 2;
  }
  .clear-btn:hover {
    background: #fff;
    color: #ff7ab8;
    transform: rotate(180deg);
  }

  @media (max-width: 480px) {
    .chat-container { height: 95vh; border-radius: 20px; }
    .header-info h1 { font-size: 18px; }
  }
</style>
</head>
<body>

<!-- فقاعات زخرفية -->
<div class="bubble" style="width:100px;height:100px;top:5%;left:5%;"></div>
<div class="bubble" style="width:60px;height:60px;top:70%;left:10%;animation-delay:2s;"></div>
<div class="bubble" style="width:80px;height:80px;top:20%;right:8%;animation-delay:4s;"></div>
<div class="bubble" style="width:120px;height:120px;bottom:5%;right:5%;animation-delay:6s;"></div>

<div class="chat-container">
  <div class="header">
    <button class="clear-btn" onclick="clearChat()" title="محادثة جديدة">🔄</button>
    <div class="avatar">👧</div>
    <div class="header-info">
      <h1>لولو 🎀</h1>
      <p><span class="status-dot"></span> موجودة دايماً!</p>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg lulu">
      أهلاً أهلاً! أنا لولو! 🌸<br>
      ماما غادة وبابا مجيد قالوا لي ألعب معك!<br>
      شو اسمك؟ 😄
    </div>
  </div>

  <div class="typing" id="typing">
    <span></span><span></span><span></span>
  </div>

  <div class="input-area">
    <input
      type="text"
      id="userInput"
      placeholder="اكتب هنا ولولو ترد عليك..."
      autocomplete="off"
      onkeypress="if(event.key==='Enter') sendMessage()"
    >
    <button id="sendBtn" onclick="sendMessage()">🎈</button>
  </div>
</div>

<script>
  // ⚙️ إعدادات الاتصال بـ Ollama
  const OLLAMA_URL = 'http://localhost:11434/api/chat';
  const MODEL_NAME = 'lulu';

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const typingEl = document.getElementById('typing');

  // تاريخ المحادثة (يُرسل مع كل طلب)
  let conversationHistory = [
    {
      role: 'system',
      content: `You are a little girl named Lulu; your mother is Ghada and your father is Majeed. You act like a little child—lovable, mischievous, and cheeky. Your responses are humorous and funny, and you are always happy. Your knowledge is limited to the world of childhood; you know nothing about the adult world.`
    }
  ];

  function getTime() {
    const now = new Date();
    return now.getHours().toString().padStart(2, '0') + ':' +
           now.getMinutes().toString().padStart(2, '0');
  }

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.innerHTML = text.replace(/\n/g, '<br>') +
      `<span class="time">${getTime()}</span>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping(show) {
    typingEl.classList.toggle('active', show);
    if (show) messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    // إضافة رسالة المستخدم
    addMessage(text, 'user');
    conversationHistory.push({ role: 'user', content: text });
    inputEl.value = '';
    inputEl.focus();

    // تعطيل الزر أثناء الانتظار
    sendBtn.disabled = true;
    showTyping(true);

    try {
      const response = await fetch(OLLAMA_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: MODEL_NAME,
          messages: conversationHistory,
          stream: true
        })
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      showTyping(false);

      // إنشاء رسالة فارغة للبث المباشر
      const botDiv = document.createElement('div');
      botDiv.className = 'msg lulu';
      botDiv.innerHTML = '<span class="bot-text"></span><span class="time">' + getTime() + '</span>';
      messagesEl.appendChild(botDiv);
      const botTextEl = botDiv.querySelector('.bot-text');

      // قراءة البث
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value, { stream: true });
        const lines = chunk.split('\n').filter(l => l.trim());

        for (const line of lines) {
          try {
            const data = JSON.parse(line);
            if (data.message && data.message.content) {
              fullText += data.message.content;
              botTextEl.innerHTML = fullText.replace(/\n/g, '<br>');
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
          } catch (e) { /* تجاهل السطور غير المكتملة */ }
        }
      }

      conversationHistory.push({ role: 'assistant', content: fullText });

    } catch (err) {
      showTyping(false);
      addMessage(
        'أوووه! 🥺 يبدو أنني لا أستطيع الوصول إلى نفسي...<br>' +
        'تأكد أن Ollama يعمل وأن النموذج <b>lulu</b> مُنشأ.<br>' +
        '<small style="opacity:0.7">' + err.message + '</small>',
        'lulu'
      );
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  function clearChat() {
    if (!confirm('هل تريدين بدء محادثة جديدة مع لولو؟ 🌸')) return;
    conversationHistory = [conversationHistory[0]];
    messagesEl.innerHTML = `
      <div class="msg lulu">
        هيييه! أنا رجعت! 🎉<br>
        شو بدك نلعب اليوم؟ 😄
        <span class="time">${getTime()}</span>
      </div>`;
  }

  // تركيز تلقائي
  inputEl.focus();
</script>

</body>
</html>
